worker_processes auto;

events {
	worker_connections 1024;
}

http {
	map $http_x_request_id $file_server_request_id {
		default $http_x_request_id;
		"" $request_id;
	}

	map $http_x_trace_id $file_server_trace_id {
		default $http_x_trace_id;
		"" $file_server_request_id;
	}

	upstream storage_backend {
		server storage:3032;
		keepalive 16;
	}

	upstream cache_backend {
		server cache:3030;
		keepalive 16;
	}

	server {
		listen 8080;
		server_name _;

		client_max_body_size 22m;
		proxy_connect_timeout 2s;
		proxy_send_timeout 5s;
		proxy_read_timeout 5s;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_intercept_errors off;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Request-Id $file_server_request_id;
		proxy_set_header X-Trace-Id $file_server_trace_id;
		proxy_set_header X-Client-Api-Key $http_x_client_api_key;
		proxy_set_header Authorization $http_authorization;
		proxy_set_header Idempotency-Key $http_idempotency_key;
		add_header X-File-Server-Proxy nginx-travel-cloud always;

		location = /health/live {
			access_log off;
			default_type application/json;
			return 200 '{"ok":true,"service":"travel-cloud-reverse-proxy"}';
		}

		# The public write surface. Reads never reach storage directly.
		location = /file-server/images {
			limit_except POST DELETE {
				deny all;
			}
			proxy_pass http://storage_backend/image;
		}

		# The public read surface. Cache owns the external read boundary.
		location ^~ /file-server/images/ {
			limit_except GET HEAD {
				deny all;
			}
			rewrite ^/file-server/images/(.*)$ /image/$1 break;
			proxy_pass http://cache_backend;
		}

		# Harness-only readiness paths. Production control-plane exposure is separate.
		location = /file-server/health/storage/ready {
			proxy_pass http://storage_backend/health/ready;
		}

		location = /file-server/health/cache/ready {
			proxy_pass http://cache_backend/health/ready;
		}
	}
}
