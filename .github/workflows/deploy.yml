name: file-server-deploy

on:
  workflow_run:
    workflows: [file-server-ci]
    types: [completed]

concurrency:
  group: file-server-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish ${{ matrix.app }} image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [storage, resize, cache]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}:${{ env.IMAGE_SHA }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-storage:
    name: Deploy storage
    needs: publish
    runs-on: [file-server]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/storage:${{ github.event.workflow_run.head_sha }}
      CONTAINER_NAME: file_server_storage
      FILE_DUMP_VOLUME: file_dump_volume
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace container without starting it before network attachment
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker create \
            --env-file "${{ secrets.STORAGE_ENV_PATH }}" \
            --env HOST=0.0.0.0 \
            --volume "$FILE_DUMP_VOLUME:/usr/index/apps/storage/dist/apps/storage/assets" \
            --publish "${{ secrets.STORAGE_PORT }}:${{ secrets.STORAGE_PORT }}" \
            --name "$CONTAINER_NAME" \
            --restart always \
            "$IMAGE"
          docker network connect "${{ secrets.FILE_SERVER_NET }}" "$CONTAINER_NAME"
          docker network connect "${{ secrets.KAFKA_NET }}" "$CONTAINER_NAME"
          docker start "$CONTAINER_NAME"
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
            "http://127.0.0.1:${{ secrets.STORAGE_PORT }}/health-check"

  deploy-resize:
    name: Deploy resize
    needs: publish
    runs-on: [file-server]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/resize:${{ github.event.workflow_run.head_sha }}
      CONTAINER_NAME: file_server_resize
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace container without starting it before network attachment
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker create \
            --env-file "${{ secrets.RESIZE_ENV_PATH }}" \
            --env HOST=0.0.0.0 \
            --publish "${{ secrets.RESIZE_PORT }}:${{ secrets.RESIZE_PORT }}" \
            --name "$CONTAINER_NAME" \
            --restart always \
            "$IMAGE"
          docker network connect "${{ secrets.FILE_SERVER_NET }}" "$CONTAINER_NAME"
          docker network connect "${{ secrets.KAFKA_NET }}" "$CONTAINER_NAME"
          docker start "$CONTAINER_NAME"
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
            "http://127.0.0.1:${{ secrets.RESIZE_PORT }}/health-check"

  deploy-cache:
    name: Deploy cache
    needs: publish
    runs-on: [file-server]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cache:${{ github.event.workflow_run.head_sha }}
      CONTAINER_NAME: file_server_cache
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace container without starting it before network attachment
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker create \
            --env-file "${{ secrets.CACHE_ENV_PATH }}" \
            --env HOST=0.0.0.0 \
            --publish "${{ secrets.CACHE_PORT }}:${{ secrets.CACHE_PORT }}" \
            --name "$CONTAINER_NAME" \
            --restart always \
            "$IMAGE"
          docker network connect "${{ secrets.FILE_SERVER_NET }}" "$CONTAINER_NAME"
          docker start "$CONTAINER_NAME"
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
            "http://127.0.0.1:${{ secrets.CACHE_PORT }}/health-check"
